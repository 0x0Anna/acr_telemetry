[package]
name = "acr-launcher"
version = "0.1.0"
edition = "2024"
description = "Slint GUI launcher for acr_telemetry's recorder/export/status tools."
build = "build.rs"

[[bin]]
name = "acr-launcher"
path = "src/main.rs"

[dependencies]
acr_recorder = { path = "../.." }
acc_shared_memory_rs = { path = "../../vendor/acc_shared_memory_rs" }
slint = "1.17"
rfd = "0.17"

[build-dependencies]
slint-build = "1.17"
