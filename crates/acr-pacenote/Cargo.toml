[package]
name = "acr_pacenote"
version = "0.1.0"
edition = "2024"
description = "Pacenote courses, voice playback, and picker overlays for ACR"

[dependencies]
acr_telemetry = { path = "../acr-telemetry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
