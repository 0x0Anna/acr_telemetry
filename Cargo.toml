[workspace]
members = [
    ".",
    "crates/acr-telemetry",
    "crates/acr-pacenote",
    "crates/acr-timing",
    "crates/acr-timing-protocol",
    "crates/acr-timing-store",
    "crates/acr-timing-engine",
    "crates/acr-timing-presenter",
]
resolver = "2"

[package]
name = "acr_recorder"
version = "0.0.6"
edition = "2024"

[lib]
name = "acr_recorder"
path = "src/lib.rs"

[[bin]]
name = "acr_recorder"
path = "src/main.rs"

[[bin]]
name = "acr_export"
path = "src/bin/acr_export.rs"

[[bin]]
name = "acr_telemetry_bridge"
path = "src/bin/acr_telemetry_bridge.rs"

[[bin]]
name = "acr_analysis_export"
path = "src/bin/acr_analysis_export.rs"

[[bin]]
name = "acr_track_match"
path = "src/bin/acr_track_match.rs"

[[bin]]
name = "acr_timing"
path = "src/bin/acr_timing.rs"
required-features = ["acr_timing_bin"]

[[bin]]
name = "acr_rtss_osd"
path = "src/bin/acr_rtss_osd.rs"

[[bin]]
name = "acr_timing_presenter_demo"
path = "src/bin/acr_timing_presenter_demo.rs"

[[bin]]
name = "acr_motec"
path = "src/bin/acr_motec.rs"

[[bin]]
name = "acr_grip_estimator"
path = "src/bin/acr_grip_estimator.rs"

[[bin]]
name = "acr_extract_timing_sectors"
path = "src/bin/acr_extract_timing_sectors.rs"

[[bin]]
name = "acr_plot_recording"
path = "src/bin/acr_plot_recording.rs"

[[bin]]
name = "acr_lookup_split_positions"
path = "src/bin/acr_lookup_split_positions.rs"

[[bin]]
name = "acr_compare_gfx_physics"
path = "src/bin/acr_compare_gfx_physics.rs"

[[bin]]
name = "acr_time_analysis"
path = "src/bin/acr_time_analysis.rs"

[[bin]]
name = "acr_segment_speed_report"
path = "src/bin/acr_segment_speed_report.rs"

[[bin]]
name = "acr_find_position_times"
path = "src/bin/acr_find_position_times.rs"

[[bin]]
name = "acr_stream_lag_test"
path = "src/bin/acr_stream_lag_test.rs"

[[bin]]
name = "acr_analyze_timing_recording"
path = "src/bin/acr_analyze_timing_recording.rs"

[features]
default = ["acr_timing_bin"]
# Timing-only build: pacenotes disabled at runtime (`acr_timing` bin always sets this).
acr_timing_bin = []

[dependencies]
acr_telemetry = { path = "crates/acr-telemetry" }
acr_timing = { path = "crates/acr-timing" }
acr_timing_protocol = { path = "crates/acr-timing-protocol" }
acr_timing_store = { path = "crates/acr-timing-store" }
acr_timing_engine = { path = "crates/acr-timing-engine" }
acr_timing_presenter = { path = "crates/acr-timing-presenter" }
acr_pacenote = { path = "crates/acr-pacenote" }
acc_shared_memory_rs = { path = "vendor/acc_shared_memory_rs" }
rkyv = { version = "0.7", features = ["std"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
toml = "0.8"
dirs = "5.0"
tiny_http = "0.12"
shapefile = "0.8.0"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "handleapi",
    "memoryapi",
    "synchapi",
    "winnt",
    "errhandlingapi",
    "winuser",
] }
