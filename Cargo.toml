[package]
name = "acr_recorder"
version = "0.1.0"
edition = "2024"

[lib]
name = "acr_recorder"
path = "src/lib.rs"

[[bin]]
name = "acr_recorder"
path = "src/main.rs"

[[bin]]
name = "acr_export"
path = "src/bin/acr_export.rs"

[[bin]]
name = "acr_telemetry_bridge"
path = "src/bin/acr_telemetry_bridge.rs"

[[bin]]
name = "acr_analysis_export"
path = "src/bin/acr_analysis_export.rs"

[[bin]]
name = "acr_track_match"
path = "src/bin/acr_track_match.rs"

[[bin]]
name = "acr_rtss_osd"
path = "src/bin/acr_rtss_osd.rs"

[[bin]]
name = "acr_beep_demo"
path = "src/bin/acr_beep_demo.rs"

[[bin]]
name = "acr_sectors_filter"
path = "src/bin/acr_sectors_filter.rs"

[[bin]]
name = "acr_grip_estimator"
path = "src/bin/acr_grip_estimator.rs"

[dependencies]
acc_shared_memory_rs = { path = "vendor/acc_shared_memory_rs" }
rkyv = { version = "0.7", features = ["std"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
toml = "0.8"
dirs = "5.0"
tiny_http = "0.12"
shapefile = "0.8.0"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "handleapi",
    "memoryapi",
    "synchapi",
    "winnt",
    "errhandlingapi",
    "winuser",
] }
