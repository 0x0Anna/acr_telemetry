name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: >
          cargo build --release --features acr_timing_bin
          --bin acr_recorder --bin acr_export --bin acr_motec
          --bin acr_telemetry_bridge --bin acr_analysis_export
          --bin acr_track_match --bin acr_timing --bin acr_rtss_osd

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Package install bundle (zip + setup.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"(.+)"\s*$' | Select-Object -First 1).Matches.Groups[1].Value
          powershell -NoProfile -ExecutionPolicy Bypass -File install/build.ps1 -SkipCargoBuild
          Copy-Item "target/install/ACR_Recorder_${version}_windows-x64_portable.zip" "acr-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            acr-${{ github.ref_name }}-windows-x86_64.zip
            target/install/ACR_Recorder_*_setup.exe
          generate_release_notes: true
